name: Tests

on:
  push:
  pull_request:

env:
  WHATSAPP_ENABLED: "false"
  TRADING_ENABLED: "false"
  WITHDRAWALS_ENABLED: "false"
  ORDER_EXECUTION_ENABLED: "false"
  EXCHANGE_MODE: "disabled"
  NEWS_API_KEY: ""
  COINGECKO_API_KEY: ""
  CRYPTOPANIC_API_KEY: ""
  OPENAI_API_KEY: ""
  HTTP_MAX_RETRIES: "2"
  HTTP_BACKOFF_SECONDS: "0.5"
  HTTP_CACHE_TTL_SECONDS: "60"
  HTTP_CACHE_ENABLED: "true"
  HTTP_CACHE_BACKEND: "memory"
  HTTP_CACHE_DIR: ".cache/crypto-market-agents"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Compile source and tests
        run: python3 -m compileall src tests scripts

      - name: Ruff lint
        run: python -m ruff check src tests scripts

      - name: Ruff format check
        run: python -m ruff format --check src tests scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run coverage
        run: python -m coverage run -m unittest discover -s tests

      - name: Coverage report
        run: python -m coverage report --fail-under=80

      - name: Run mock full pipeline
        run: python3 scripts/test_full_pipeline_mock.py

      - name: Run mock orchestrator
        run: python3 scripts/test_orchestrator_mock.py

      - name: Run mock CLI
        run: python3 scripts/test_cli_mock.py

      - name: Run mock scheduler
        run: python3 scripts/test_scheduler_mock.py

      - name: Run mock dashboard
        run: python3 scripts/test_dashboard_mock.py

      - name: Run mock paper portfolio
        run: python3 scripts/test_paper_mock.py

      - name: Test wheel outside checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir /tmp/cma-wheels
          python -m venv /tmp/cma-installed
          /tmp/cma-installed/bin/python -m pip install /tmp/cma-wheels/*.whl
          cd /tmp
          /tmp/cma-installed/bin/crypto-market-agents paper init --state /tmp/cma-wheel-paper.json
          /tmp/cma-installed/bin/crypto-market-agents paper run --state /tmp/cma-wheel-paper.json --mock --runs 3 --interval-seconds 0 --output-dir /tmp/cma-wheel-reports

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t crypto-market-agents .

      - name: Exercise paper portfolio in container
        run: docker run --rm --network none crypto-market-agents python3 scripts/test_paper_mock.py
